services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./html:/var/www/html
      - ./src:/var/www/src
    environment:
      DB_HOST: db
      DB_NAME: soffkanten
      DB_USER: soffkanten
      DB_PASS: hemligt
    depends_on:
      - db
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootlosen
      MYSQL_DATABASE: soffkanten
      MYSQL_USER: soffkanten
      MYSQL_PASSWORD: hemligt
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      # schema.sql körs automatiskt när databasen startas första gången
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
volumes:
  dbdata:
